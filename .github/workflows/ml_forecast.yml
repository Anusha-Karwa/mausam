# Flow 2: Friday night forecasts and category averages (Sat ~01:00 IST), or run manually.
name: ML forecasts (Friday night)

on:
  schedule:
    - cron: "30 19 * * 5"
  workflow_dispatch:
    inputs:
      rediscover_peers:
        description: "Re-pick the 12 peer funds per category"
        type: boolean
        default: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Install
        run: pip install -r ml/requirements.txt
      - name: Check secrets
        run: test -n "$DATABASE_URL" || (echo "::error::Add DATABASE_URL in Settings > Secrets and variables > Actions" && exit 1)
      - name: Backfill NAV and index history
        run: python ml/backfill.py
      - name: Category averages from peers
        run: python ml/peers.py ${{ inputs.rediscover_peers && '--rediscover' || '' }}
      - name: Hybrid ARIMA + Ridge forecasts and backtests
        run: python ml/forecast.py
