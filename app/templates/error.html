{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px;margin:40px auto;text-align:center">
  <div style="width:180px;height:120px;margin:0 auto">{% with kind='storm', animate=false %}{% include "partials/weather_sky.html" %}{% endwith %}</div>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <div class="row" style="justify-content:center"><a class="btn btn-primary" href="/">Back to Today</a><a class="btn" href="/status">System status</a></div>
  <p class="small muted" style="margin-top:14px">Error {{ code }}</p>
</div>
{% endblock %}
