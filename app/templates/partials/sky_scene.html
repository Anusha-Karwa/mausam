{# Full-screen weather behind every page. Which pieces show depends on the body class
   (sky-clear | sky-clouds | sky-storm) and html[data-mode=day|night]; see "Sky scene" in mausam.css. #}
<div class="sky-scene" aria-hidden="true">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="cloud-shape" viewBox="0 0 200 90">
        <path d="M38 88h126a34 34 0 0 0 4-67.7A46 46 0 0 0 82 16 32 32 0 0 0 38 44a22 22 0 0 0 0 44z"/>
      </symbol>
      <radialGradient id="moon-shade" cx="38%" cy="35%" r="70%">
        <stop offset="0%" stop-color="#FFFBEA"/>
        <stop offset="70%" stop-color="#E9E4CF"/>
        <stop offset="100%" stop-color="#C9C2A6"/>
      </radialGradient>
    </defs>
  </svg>

  <div class="sky-glow"></div>
  <div class="stars"></div>

  <div class="sun">
    <div class="sun-halo"></div>
    <svg class="sun-rays" viewBox="-100 -100 200 200">
      {% for a in range(0, 360, 20) %}<line x1="0" y1="-62" x2="0" y2="{{ -92 if loop.index is odd else -80 }}" transform="rotate({{ a }})"/>{% endfor %}
    </svg>
    <div class="sun-core"></div>
  </div>

  <div class="moon">
    <div class="moon-halo"></div>
    <svg class="moon-core" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="url(#moon-shade)"/>
      <circle cx="34" cy="40" r="8" fill="#D8D1B5" opacity=".7"/>
      <circle cx="60" cy="62" r="11" fill="#D8D1B5" opacity=".6"/>
      <circle cx="64" cy="30" r="5" fill="#D8D1B5" opacity=".6"/>
      <circle cx="40" cy="70" r="4" fill="#D8D1B5" opacity=".5"/>
    </svg>
  </div>

  <div class="clouds">
    {% for c in range(7) %}<svg class="cloud cloud-{{ c }}"><use href="#cloud-shape"/></svg>{% endfor %}
  </div>

  <canvas class="rain" id="rain-canvas"></canvas>
  <div class="lightning"></div>
</div>
